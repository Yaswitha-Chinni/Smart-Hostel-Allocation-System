<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - KITSW Hostel</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: white;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
        }
        .admin-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .admin-filters select, .admin-filters input {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            outline: none;
        }
        .table-wrapper {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: #f8fafc;
            font-weight: 600;
            color: var(--text);
            position: sticky;
            top: 0;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover {
            background: #f8fafc;
        }
        .status-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-badge.booked {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }
        .status-badge.pending {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }
        .btn-logout {
            padding: 0.5rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body class="dashboard-page">

    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1 style="color: var(--primary); margin: 0; font-size: 1.8rem;">Admin Dashboard</h1>
                <p style="margin: 0; color: var(--muted); margin-top: 0.3rem;">Manage and view student hostel allocations</p>
            </div>
            <button class="btn-logout" id="admin-logout-btn">Logout</button>
        </div>

        <div class="admin-filters">
            <input type="text" id="search-input" placeholder="Search by Roll No or Name..." style="flex: 1; max-width: 300px;">
            <select id="status-filter">
                <option value="All">All Statuses</option>
                <option value="Booked">Booked Only</option>
                <option value="Pending">Pending Only</option>
            </select>
            <select id="gender-filter">
                <option value="All">All Genders</option>
                <option value="Male">Boys Only</option>
                <option value="Female">Girls Only</option>
            </select>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Roll Number</th>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Status</th>
                        <th>Room No</th>
                        <th>Floor</th>
                        <th>Token Number</th>
                    </tr>
                </thead>
                <tbody id="student-table-body">
                    <!-- Data populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <p id="alert-message"></p>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
