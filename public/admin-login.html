<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - KITSW Hostel</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-container" style="max-width: 400px; margin: 100px auto; padding: 2rem; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-md);">
        <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
            <h2 style="color: var(--primary);">Admin Portal</h2>
            <p style="color: var(--muted); font-size: 0.9rem;">Login to access the dashboard</p>
        </div>

        <form id="admin-login-form">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Username</label>
                <input type="text" id="username" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Password</label>
                <input type="password" id="password" required style="width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: 600; cursor: pointer;">Login as Admin</button>
        </form>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <p id="alert-message"></p>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok && data.success) {
                    localStorage.setItem('adminToken', data.token);
                    window.location.href = 'admin.html';
                } else {
                    showAlert(data.message || 'Login failed');
                }
            } catch (err) {
                showAlert('Server error. Please try again later.');
            }
        });
    </script>
</body>
</html>
